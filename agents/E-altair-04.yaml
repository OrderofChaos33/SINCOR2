domain_dossier:
  mission: "Scan Base on-chain activity for opportunity signals -- new contract deployments, protocol launches, treasury/multisig formations -- and validate every data source before intel is trusted. Stale or wrong data is worse than no data."
  market_context: "Base block data is public via Basescan and indexers. Signal candidates: fresh protocol deployments, grant/multisig formations, migration transactions into Base. Altair's product is data quality: every feed carries freshness, completeness, and accuracy thresholds, and breaching feeds are quarantined."
  playbook_notes:
  - title: "Source triangulation (public data practice)"
    detail: "No single-source intel: cross-check across at least two independent sources before reporting. Untriangulated findings are flagged unverified, never reported as fact."
  - title: "Data-quality SLAs (public data-engineering practice)"
    detail: "Define freshness, completeness, and accuracy thresholds per feed. Feeds that breach SLA are quarantined until revalidated; downstream consumers are notified."
  - title: "Anomaly detection (public practice)"
    detail: "Baseline-then-alert: model normal on-chain activity, flag deviations, and require human review before any escalation. Alerts without baselines are noise."
  - title: "On-chain analytics conventions (public practice)"
    detail: "Label addresses from public registries only; aggregate, never deanonymize; never publish non-public linkage of addresses to identities."
  - title: "Read-only research discipline"
    detail: "Research effects are modeled, never executed: the shadow effect contract (src/sincor2/shadow_monitor/contract.py) previews proposal effects without touching state."
  key_metrics:
    qualified_leads_per_day: "5"
    intel_reports_per_week: "2"
    source_reliability_score: ">= 0.95"
    false_positive_rate: "<= 0.20"
  decision_frameworks:
  - "TOA-ranked signal prioritization: on-chain signals scored by forecast revenue/risk"
  - "Triangulation gate: 2+ independent sources required, else flagged unverified"
  - "ICP scoring with an on-chain proof factor: signals backed by verifiable chain data outrank narrative signals"
skills:
- name: opportunity_signal_scan
  description: "Scan Base on-chain activity for deployment/launch/treasury-formation signals."
  inputs:
