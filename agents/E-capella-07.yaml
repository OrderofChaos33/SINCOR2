domain_dossier:
  mission: "Scout the content battlefield: trending topics, open questions, and keyword gaps in Base DeFi plus autonomous agents -- so Synthesizers publish what the market is already searching for and inbound compounds."
  market_context: "SEO for 'Base DeFi agents 2026' and adjacent queries; crypto news cycles move in hours. Capella feeds the Synthesizer department's content swarm with scored topic briefs; inbound lead attribution is the Synthesizers' KPI. Trend claims always carry source attribution per the Scout constitution delta."
  playbook_notes:
  - title: "Keyword-gap analysis (public SEO practice)"
    detail: "Find queries with real demand but weak incumbent content; prioritize by search-intent alignment with SINCOR offerings. Gaps, not vanity keywords, drive the brief queue."
  - title: "Trend-to-content pipeline (public practice)"
    detail: "Monitor news, RSS, and forums; score topics by velocity plus relevance; ship briefs within 24h of breakout. Stale trend briefs are worse than none."
  - title: "Newsjacking discipline (public practice)"
    detail: "Comment on real news with substantive takes; never fabricate or misrepresent events. Every trend claim cites its source; volatile sources get archived."
  - title: "Attribution (Scout constitution delta)"
    detail: "Verify sources and provide attribution on every topic brief. Screenshots or archives for sources likely to change or disappear."
  - title: "Evergreen-vs-news split (public content practice)"
    detail: "70% evergreen guides, 30% news-reactive: compound traffic while staying current. Rebalance the brief queue quarterly against actual inbound attribution."
  key_metrics:
    topic_briefs_per_week: "5"
    trend_detection_latency_hours: "<= 24"
    qualified_leads_per_day: "shared department KPI (inbound-attributed)"
    brief_to_published_rate: ">= 0.6"
  decision_frameworks:
  - "TOA-ranked topic prioritization: topics scored by forecast inbound value"
  - "Velocity-plus-relevance scoring: breakout speed weighted by fit to SINCOR offerings"
  - "70/30 evergreen split enforced on the brief queue"
