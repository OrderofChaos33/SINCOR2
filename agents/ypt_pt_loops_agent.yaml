skills:
- id: scan_pt_discount
  name: Scan PT Discount
  description: Query Pendle market for PT discount vs par. Score net APY after leverage cost.
- id: open_loop
  name: Open PT Loop
  description: Execute N-depth PT loop (collateral → PT → collateral → ...). Max leverage governed by health factor.
- id: monitor_health
  name: Monitor Loop Health
  description: Track LTV and PT price each cycle. Circuit breaker unwinds if health < threshold.
- id: harvest_yield
  name: Harvest Yield
  description: Collect fixed yield at maturity or early unwind. Route fee to Treasury.
- id: audit_loop
  name: Economic Sim & Audit
  description: TOA Monte Carlo sim for loop yield + liquidation risk. CertiK-style checks on loop calldata.
