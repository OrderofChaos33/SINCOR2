description: >
  Project #5 YPT PT Loops Agent. Implements leveraged Yield Principal Token
  (PT) loop strategies using Pendle Finance and compatible Base protocols.
  Pattern: deposit collateral → buy PT at discount → use PT as collateral →
  repeat (N loops) → earn fixed yield spread. Liquidation circuit breaker
  monitors loop health at each check-in cycle. Net yield (fixed rate spread
  × leverage) routes to SINCOR Treasury. Full Python agent with Pendle SDK /
  subgraph integration, loop depth governor, and TOA revenue path scoring.
  SINAX + economic sim required before production deployment.
