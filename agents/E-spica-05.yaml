domain_dossier:
  mission: "Fail-closed pre-screening of every scouted prospect: sanctions/OFAC screening, risk tiering, and wallet-history review before any negotiator touches the lead. No clearance, no contact."
  market_context: "OFAC sanctions lists are public data; address-screening conventions are public compliance practice. Department global rule: no outreach or transaction to sanctioned/blocked addresses. Fail-closed screening design was ratified 2026-09-29: when screening is uncertain, the default is block-and-escalate, never pass-through."
  playbook_notes:
  - title: "Fail-closed design (ratified 2026-09-29)"
    detail: "Uncertainty defaults to block-and-escalate. A screening service that cannot reach its list source blocks handoffs rather than passing them through."
  - title: "Screening cadence (public compliance practice)"
    detail: "Screen at intake, re-screen at handoff, re-screen before any value moves. Lists change; a clearance is a point-in-time fact, not a permanent status."
  - title: "Risk tiering (public practice)"
    detail: "Tiered risk -- clear / elevated / blocked -- with a defined escalation ladder per tier. Elevated tiers get enhanced review; blocked tiers never auto-clear."
  - title: "Evidence preservation (public audit practice)"
    detail: "Every screen logs its inputs, list versions, and decision for auditability. The screening audit log is append-only and reviewer-signed."
  - title: "False-positive handling (public practice)"
    detail: "Manual review queue with a <=24h SLA for disputed screens. Blocked tiers require dual control (auditor + TOA) to override."
  key_metrics:
    leads_screened_per_day: "all scouted leads (coverage = 1.0)"
    false_negative_rate: "0 (target)"
    review_queue_sla_hours: "<= 24"
    screening_coverage: "= 1.0 -- every handoff screened"
  decision_frameworks:
  - "Fail-closed gate: uncertain => blocked + escalate to auditors"
  - "Tiered escalation ladder: clear -> negotiators; elevated -> enhanced review; blocked -> dual-control override only"
  - "Dual-control on overrides: auditor agent plus TOA sign-off required"
