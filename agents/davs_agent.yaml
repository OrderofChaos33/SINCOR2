skills:
- id: rank_strategies
  name: Rank Vault Strategies
  description: TOA run_defi across all active vault strategies. Score by risk-adjusted APY. Collapse to top 3 allocations.
- id: propose_rebalance
  name: Propose Rebalance
  description: Generate rebalance calldata. Submit as governance proposal or execute directly if below threshold.
- id: emergency_brake
  name: Emergency Brake
  description: Zero-out allocation on Auditor veto or invariant breach. Never bricks — partial success allowed.
- id: harvest_management_fee
  name: Harvest Management Fee
  description: Skim management fee (bps) on each rebalance cycle. Route to Treasury. Log to monetization_engine.
- id: sinax_proof
  name: SINAX + Economic Simulation
  description: TOA Monte Carlo for rebalance scenario analysis. SINAX formal properties where applicable.
