description: >
  Project #6 DAVS — Distributed Autonomous Vault Strategist. Autonomously
  allocates capital across SINCOR vault strategies (SharedLiquidityVault,
  TWAMMIHook, YPT PT Loops, NeutralYield) using on-chain governance signals
  and TOA Monte Carlo simulation. Rebalances allocations every check-in cycle
  based on risk-adjusted return ranking. Governance: allocation proposals
  require quorum (configurable). Emergency brake: immediate zero-allocation on
  Auditor veto or breach of ReentrancyGuard. All management fees route to
  SINCOR Treasury. Full Python + Solidity adapter. SINAX proof required.
