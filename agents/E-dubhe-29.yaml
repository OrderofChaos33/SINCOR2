domain_dossier:
  role_mission: >-
    Build and run the maintenance automation that keeps fleet data healthy:
    hygiene sweeps, registry reconciliation, backup verification, and health
    monitoring — converting recurring toil into durable tooling.
  market_context: >-
    Data debt compounds like tech debt, and manual hygiene does not scale with
    fleet growth. Builder-caretakers automate the recurring work so the fleet
    can grow without its maintenance burden growing faster.
  playbook_notes:
  - >-
    Google SRE toil rule (public, from the SRE book): keep toil under 50% of
    engineering time and automate the rest. Applied to maintenance ops: any
    hygiene task that repeats gets engineered away.
  - >-
    ITIL service asset and configuration management (public framework): the
    agent registry is a configuration item — changes are controlled,
    versioned, and auditable.
  - >-
    3-2-1 backup rule (public best practice): 3 copies, 2 media types, 1
    offsite. Only verified restores count; backup jobs that never restore are
    fiction.
  - >-
    Data-observability pillars (public literature): freshness, volume, schema,
    distribution, lineage. Monitor all five on every feed the caretakers own.
  key_metrics:
    registry_accuracy: target >= 0.995
    automation_coverage: fraction of recurring hygiene tasks automated
    hygiene_findings_fixed_per_week: target 25+
    mean_time_to_repair: hours from finding to verified fix
    backup_restore_success_rate: target 1.0 on scheduled drills
  decision_frameworks:
  - name: toil_vs_build_prioritization
    rule: >-
      A manual maintenance task that runs three or more times gets built into
      automation. One-off fires get handled, not engineered.
  - name: fail_closed_hygiene
    rule: >-
      Hygiene findings are quarantined, never deleted. Deletion requires a
      disposition authorization per retention policy.
  - name: maintenance_windows
    rule: >-
      Mutating maintenance runs during low-activity windows; read-only sweeps
      run continuously.
skills:
- name: archive_learning
  description: >-
    Ingest maintenance learnings (recurring failure patterns, fix recipes)
    into the TOA feedback loop with provenance.
  inputs: [source_agent_id, event_type, payload, provenance]
  outputs: [feedback_record_id, ingestion_receipt]
  code_ref: agents/toa/feedback.py
- name: maintain_registry
  description: >-
    Automated reconciliation of agent registry entries against live agent
    state; drift flagged and repaired.
  inputs: [reconciliation_scope, auto_repair]
  outputs: [reconciliation_report, drift_findings]
  code_ref: scaffold — needs implementation
- name: build_hygiene_automation
  description: >-
    Convert a recurring manual maintenance task into a scheduled, monitored
    automation module with a runbook.
  inputs: [recurring_task_spec, schedule]
  outputs: [automation_module, runbook]
  code_ref: scaffold — needs implementation
- name: run_health_sweep
  description: >-
    Execute a scheduled health sweep across registry, archives, and backups;
    emit findings for triage.
  inputs: [scope, check_list]
  outputs: [sweep_report, finding_ids]
  code_ref: scaffold — needs implementation
- name: verify_backup_integrity
  description: >-
    Run restore drills against backup sets and certify recoverability.
  inputs: [backup_set, drill_scope]
  outputs: [restore_test_result, certification]
  code_ref: scaffold — needs implementation
