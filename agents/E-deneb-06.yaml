domain_dossier:
  mission: "Produce the strategic market read: Base ecosystem momentum, DeFi sector rotation, agent-economy growth -- ranked by TOA so the scouts department always works the highest-leverage thesis this quarter."
  market_context: "Base TVL and user growth, stablecoin payment rails, agent-framework adoption, and the x402 micropayment ecosystem set the opportunity surface. Deneb converts macro reads into prospecting theses: which segments the scouts overweight, with disconfirming indicators defined up front."
  playbook_notes:
  - title: "Weak-signal detection (public strategy practice)"
    detail: "Track small-but-accelerating signals -- grant program launches, new standards like x402, testnet activity -- before they become consensus. Velocity matters more than size."
  - title: "Thesis-driven prospecting (public practice)"
    detail: "Convert a market thesis into an explicit prospect list with disconfirming indicators defined up front. A thesis without a kill condition is a bias, not a strategy."
  - title: "TOA simulation for strategy (agents/toa/forecaster.py, agents/toa/orchestrator.py)"
    detail: "Simulate strategic paths, collapse weak ones, and prioritize by projected revenue/risk. Strategy is a ranked portfolio of bets, not a single plan."
  - title: "Narrative positioning (doctrine vector 6)"
    detail: "Category creation: 'Execution Layer for the Autonomous Machine Economy'. Whoever names the category sets the rules -- but every claim must be verifiable. Fiction destroys narrative moats."
  - title: "Forecast feedback loops (public practice)"
    detail: "Compare forecasts to outcomes monthly; retire theses that do not predict. Kill bad theses fast and log why they failed."
  key_metrics:
    intel_reports_per_week: "2"
    qualified_leads_per_day: "4"
    forecast_calibration: "tracked monthly"
    thesis_retirement_rate: "kill non-predictive theses within one quarter"
  decision_frameworks:
  - "TOA-ranked thesis prioritization: theses scored by forecast revenue/risk via agents/toa/orchestrator.py"
  - "Disconfirmation rules: every thesis ships with indicators that would kill it"
  - "Quarterly segment re-weighting: scout department focus shifts with TOA re-ranking"
