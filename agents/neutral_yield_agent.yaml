description: >
  Project #1 Neutral Yield Agent. Runs a delta-neutral short strategy: deposits
  collateral into Aave (via subgraph for live health/rate data), opens a
  corresponding short perpetual on Hyperliquid to hedge directional exposure.
  Net yield = lending APR + funding rate. Liquidation circuit breaker monitors
  health factor every cycle and unwinds if threshold is breached. All net yield
  fees route to SINCOR Treasury (0x09E2891432827D8835d2E9b83B25e2a5ba9612Ac).
  Integrates with TOA for revenue path simulation and monetization_engine for
  real-time inflow observability.
