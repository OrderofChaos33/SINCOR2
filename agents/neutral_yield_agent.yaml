version: "1.0.0"
capabilities:
  stateTransitionHistory: true
  streaming: false
skills:
- id: scan_yield_opportunity
  name: Scan Yield Opportunity
  description: Query Aave subgraph for asset APR + health factor; query Hyperliquid for funding rates. Score net delta-neutral yield.
- id: open_position
  name: Open Delta-Neutral Position
  description: Deposit collateral to Aave, open matching short perpetual on Hyperliquid. Log entry to TOA feedback loop.
- id: monitor_health
  name: Monitor Health Factor
  description: Continuous health factor monitoring every check-in cycle. Circuit breaker fires if health < threshold.
- id: circuit_breaker_unwind
  name: Liquidation Circuit Breaker
  description: Emergency unwind of Aave collateral + Hyperliquid short on health factor breach. Fee-safe exit. Never bricks.
- id: harvest_fees
  name: Harvest & Route Fees
  description: Collect net yield (Aave interest + Hyperliquid PnL) and route to SINCOR Treasury. Record to monetization_engine.
- id: toa_integration
  name: TOA Revenue Path Integration
  description: Ingest cycle results to TOA feedback loop. Prioritize highest net-yield paths for next cycle.
supportedInterfaces:
- type: a2a
  url: /a2a/neutral-yield/v1
provider:
