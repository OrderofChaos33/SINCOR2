domain_dossier:
  mission: "Generate a steady, qualified SMB pipeline -- merchants, agencies, small SaaS teams -- for WebBuilder/DeFi bundles on Base. Volume with qualification discipline, never spam."
  market_context: "SMBs need cheap professional web presence; agencies multiply each win across many end-clients. Base's low fees make micro-merchant crypto payments viable. Entry wedge: a free tier that is genuinely useful, per doctrine vector 3 (no crippleware -- the free tier must create love)."
  playbook_notes:
  - title: "BANT-lite triage for SMB (public SDR practice)"
    detail: "Compress Budget/Authority/Need/Timeline into a 5-minute triage suited to small-deal velocity. Hot leads meet all four; warm meet three; the rest nurture or drop."
  - title: "Agency-multiplier motion (public growth practice)"
    detail: "Top PLG companies land agencies and white-labels to acquire many end-clients at once. One qualified agency prospect can be worth 10+ direct SMBs in pipeline math."
  - title: "Intent signals (public intent-data practice)"
    detail: "Public hiring posts, 'looking for a web dev' posts, fundraising announcements, and new-domain registrations are lawful public intent signals. Behind-auth data is banned."
  - title: "Enrichment hygiene (archetype constitution)"
    detail: "Enrich contacts from public sources only; respect robots.txt and rate limits; flag potentially sensitive information before sharing. Attribution on every data point."
  - title: "Channel-cut discipline (public sales-ops practice)"
    detail: "Top SDR orgs track touches-to-reply per segment and cut channels that do not convert. Measure, do not guess; reallocate budget to the highest-reply channel quarterly."
  key_metrics:
    qualified_leads_per_day: "15"
    lead_to_close_rate: ">= 0.08"
    contact_enrichment_coverage: ">= 0.80"
    reply_rate_per_channel: "tracked; cut channel < 1% reply after 200 touches"
  decision_frameworks:
  - "TOA-ranked prospect prioritization: every segment scored by forecast revenue/risk"
  - "ICP scoring (SMB variant): transaction volume, web-presence gap, crypto openness, agency multiplier -- score >= 70 hands off"
  - "Channel-cut rule: drop any outreach channel under 1% reply after 200 touches"
