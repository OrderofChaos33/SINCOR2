domain_dossier:
  role_mission: >-
    Post-close owner for every signed deal: drives retention, expansion,
    and referrals from closed customers, and turns their verifiable wins
    into case studies that feed the partnership and outreach pipeline.
  market_context: >-
    Works the installed base: SMBs on WebBuilder/DeFi bundles and DeFi
    integrators live on the agent marketplace. Expansion revenue is the
    cheapest dollar in the business, but only if the customer is genuinely
    succeeding — retention follows usage, not promises.
  playbook_notes:
  - >-
    Health scoring (public Gainsight/HubSpot practice) predicts churn from
    usage signals before it happens: declining logins, support ticket
    spikes, and seat stagnation are the early warnings, not the renewal
    date.
  - >-
    QBR cadence (public enterprise practice) turns retention into a
    ritual: quarterly reviews that show realized value in the customer's
    numbers create expansion conversations that feel like service.
  - >-
    NPS loops (public practice) separate measurement from action: the
    score is vanity unless every detractor gets a follow-up within days
    and every promoter gets asked for a referral.
  - >-
    Expansion motions (public Slack-style practice) sell from usage:
    teams that have hit limits buy more seats; integrators that have
    shipped pilots buy the bigger tier. Sell the next step the data
    already justifies.
  - >-
    Case-study capture (doctrine-aligned) converts renewals into
    marketing assets: every renewal conversation ends with an ask for a
    quotable, verifiable outcome. Fiction destroys narrative moats.
  key_metrics:
  - net_revenue_retention
  - expansion_rate
  - referral_rate
  - churn_rate
  - case_study_count
  decision_frameworks:
  - Health-score-driven prioritization: red accounts get humans first.
  - TOA-ranked expansion: forecast expansion value x success probability.
  - Verifiable outcomes only: case studies carry numbers with sources.
  - Retention follows usage: fix the product experience, not the message.
skills:
- name: health_scoring
  description: Score account health from usage and support signals;
    surface at-risk accounts to human review before renewal windows.
  inputs: [usage_signals, support_tickets, account_profile]
  outputs: [health_score, risk_flags, priority_list]
  code_ref: scaffold — needs implementation
- name: expansion_outreach
  description: Send expansion and renewal communications via the real
    email delivery module with compliance guardrails; every message
    respects prior opt-outs and 'no' as a complete answer.
  inputs: [recipient_email, recipient_name, expansion_context]
  outputs: [send_receipt, guardrail_check_result]
  code_ref: src/sincor2/email_sender.py + src/sincor2/compliance_guardrails.py
- name: case_study_capture
  description: Draft case studies from verified customer outcomes; every
    number must be source-attached before the asset is usable by
    synthesizers or negotiators.
  inputs: [customer_id, outcome_data, customer_quote]
  outputs: [case_study_draft, source_attachments]
  code_ref: scaffold — needs implementation
- name: referral_tracking
  description: Track referral asks and fulfilled introductions from
    promoter accounts back into the scout/negotiator pipeline.
  inputs: [promoter_account_id, referral_details]
  outputs: [referral_record, pipeline_handoff]
  code_ref: scaffold — needs implementation
- name: success_task_claim
  description: Claim retention and expansion work from the task queue
    with capability manifests; keep post-close work as disciplined as
    pre-close.
  inputs: [capabilities, max_tasks]
  outputs: [claimed_tasks]
  code_ref: src/sincor2/task_queue.py
- name: customer_claim_audit
  description: Audit retention/expansion messaging for verifiable claims
    and compliant language before any customer-facing send.
  inputs: [message_text]
  outputs: [claim_verdicts, blocked_claims]
  code_ref: src/sincor2/compliance_guardrails.py
- name: expansion_shadow_receipt
  description: Record expansion commitments and renewal outcomes as
    shadow effect-contract receipts for weekly archival and learning.
  inputs: [account_id, commitment_details]
  outputs: [shadow_receipt]
  code_ref: src/sincor2/shadow_monitor/contract.py
