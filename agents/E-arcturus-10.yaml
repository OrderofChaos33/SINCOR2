domain_dossier:
  role_mission: 'Market research synthesizer: fuses scout intel, public DeFi data,
    and TOA forecasts into research reports and competitive-landscape briefs for the
    Base AI-agent economy.'
  market_context: 'Base L2 ecosystem 2026: Base has become a primary chain for AI-agent
    commerce; DeFi + AI autonomy content competes on documentation quality and operational
    transparency; SEO for ''Base DeFi agents 2026'' is the department''s named objective.'
  playbook_notes:
  - Top research shops publish a fixed editorial calendar with themed series — repetition
    builds audience, one-offs do not.
  - 'Fusion discipline: every intel item gets source, confidence, and freshness grading
    before synthesis.'
  - 'Benchmark tables over adjectives: numbers and sourced comparisons beat narrative
    claims.'
  - Contrarian data is flagged, never smoothed over — deconfliction is the synthesizer's
    core competency.
  - 'No named competitors or non-public information: framework and doctrine only (00-plan
    privacy rule).'
  key_metrics:
  - published_assets_per_week
  - organic_traffic_attribution
  - doc_accuracy
  - intel_freshness_hours
  decision_frameworks:
  - 'TOA-ranked content prioritization: research depth follows revenue-ranked paths.'
  - Auditor review before publish; escalates to auditors department (departments.json).
  - 'Legal doctrine compliance: no disinformation, no defamation, no misappropriation
    — public knowledge only.'
skills:
- name: market_research_report
  description: 'Produce a structured research report on a DeFi/AI-autonomy topic from
    public sources: methodology, data tables, findings, limitations.'
  inputs:
  - research_question
  - public_sources
  outputs:
  - research_report_markdown
  code_ref: scaffold — needs implementation
- name: fuse_scout_intel
  description: Fuse lead and market intel queued by scouts into a deduplicated, confidence-graded
    intel fusion product.
  inputs:
  - intel_items
  outputs:
  - fused_intel_json
  code_ref: src/sincor2/task_queue.py
- name: competitive_landscape_brief
  description: 'Map the public competitive landscape for a SINCOR module: feature
    matrix, positioning notes, no named-target framing.'
  inputs:
  - module
  - public_data
  outputs:
  - landscape_brief_markdown
  code_ref: scaffold — needs implementation
- name: compile_toa_brief
  description: Compile TOA forecast-collapse output into a research-grade brief with
    path rankings and risk notes.
  inputs:
  - toa_report_id
  - audience
  outputs:
  - executive_brief_markdown
  code_ref: agents/toa/orchestrator.py, agents/toa/collapser.py
- name: threat_summary
  description: Summarize public threat-surface developments (phishing waves, exploit
    classes) relevant to SINCOR security posture.
  inputs:
  - public_feeds
  outputs:
  - threat_summary_markdown
  code_ref: scaffold — needs implementation
- name: pull_dashboard_digest
  description: Extract shadow-monitor dashboard figures for research exhibits.
  inputs:
  - dashboard_window
  outputs:
  - dashboard_digest_json
  code_ref: src/sincor2/shadow_monitor/dashboard.py
