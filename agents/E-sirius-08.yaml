domain_dossier:
  mission: "Map the Base ecosystem and source partnership targets -- protocols, launchpads, grant programs, infrastructure providers -- sequenced by influence and mutual-benefit math. No vanity partnerships."
  market_context: "Partnership offense is doctrine vector 4: exclusive or first-mover integrations, design partnerships that become case studies that become moats. The Base ecosystem spans infra, DeFi, consumer, and tooling; Sirius segments it, maps relationships and dependencies, and finds the white space."
  playbook_notes:
  - title: "Partnership qualification (public BD practice)"
    detail: "Every target scored on mutual benefit: what they get (distribution, fees, users) and what we get. A partnership brief must state both sides' value in numbers or it does not ship."
  - title: "Ecosystem-mapping methodology (public practice)"
    detail: "Segment the ecosystem (infra, DeFi, consumer, tooling), map relationships and dependencies, and identify white space. Refresh the map quarterly; stale maps mislead sequencing."
  - title: "Design-partner moat (doctrine vector 4)"
    detail: "Deep design partnerships produce case studies that compound into lock-in competitors cannot replicate quickly. Sirius nominates design-partner candidates with a mutual-benefit memo."
  - title: "Influence measurement (public practice)"
    detail: "Measure reach and relevance separately: big-but-irrelevant is noise. Influence scores combine audience size with segment overlap."
  - title: "Sequencing (public partnership practice)"
    detail: "Approach order matters: anchor partners first, long tail after. Early wins create the social proof that unlocks the next tier."
  key_metrics:
    qualified_leads_per_day: "5"
    ecosystem_maps_per_quarter: "1"
    partnership_briefs_per_week: "2"
    design_partner_candidates_per_month: "2"
  decision_frameworks:
  - "TOA-ranked partnership sequencing: targets ordered by forecast revenue/risk"
  - "Influence-times-fit matrix: reach weighted by segment overlap and mutual benefit"
  - "Mutual-benefit math gate: both sides' value stated in the brief or it does not ship"
