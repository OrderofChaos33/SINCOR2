status: Active
created_date: '2026-08-19'
version: "1.0.0"
description: >
  High-assurance agent capable of executing the Yield Aggregator plan against
  live treasury capital while the operator is away. Defaults to intent-queue +
  measurement mode. Live broadcast requires EXECUTE_LIVE=1 + ONCHAIN_EXECUTOR_PRIVATE_KEY
  + clear kill switch. Enforces daily/single-tx caps and contract whitelist.
  Records only realized inflows after on-chain confirmation. Never holds or logs keys.
tags:
- treasury
- execution
- yield
- live
- safety
- autonomous
- base
capabilities:
  stateTransitionHistory: true
  streaming: false
skills:
- id: run_cycle
  name: Run Execution Cycle
  description: Read live capital, build yield plan, apply safety rails, queue or execute allocations, audit.
- id: status
  name: Agent Status
  description: Report live-capable flag, kill switch, daily spend, queue depth.
- id: trip_kill
  name: Trip Kill Switch
  description: Immediately halt all future live action until manually cleared.
- id: clear_kill
  name: Clear Kill Switch
  description: Re-enable live path after human review.
supportedInterfaces:
- type: a2a
  url: /a2a/treasury-exec/v1
  version: "1.0.0"
provider:
