domain_dossier:
  mission: "Deliver verified competitive intelligence on the Base agent-economy, DeFi-integrator, and WebBuilder-adjacent markets so every scouted prospect targets white space. Intelligence only -- never disparagement, defamation, or disinformation (doctrine: we out-execute, we do not attack)."
  market_context: "Base L2 hosts rival agent platforms, payment/agent infra (x402-adjacent services), DeFi protocols adding agent flows, and no-code site builders entering crypto. SINCOR's moat is the autonomous execution layer plus a 5% platform fee against competitors' 20-30% take rates; Auriga maps who competes where and where their coverage is thin."
  playbook_notes:
  - title: "BANT / MEDDIC qualification (public sales-framework knowledge)"
    detail: "Top BD orgs qualify leads on Budget, Authority, Need, Timeline (BANT) and, for complex deals, MEDDIC (Metrics, Economic buyer, Decision criteria, Decision process, Identify pain, Champion). Used as qualification lenses for scouted prospects; no named targets stored in this branch."
  - title: "Battlecard discipline (public competitive-intel practice)"
    detail: "Leading sales orgs keep per-competitor battlecards refreshed from primary sources -- public pricing pages, docs, launch announcements -- with attribution. Second-hand claims are quarantined as unverified. Battlecards refresh on a <=30-day cadence."
  - title: "Technographic trigger detection (public practice)"
    detail: "High-performing teams detect intent from public technographics: job posts, public repos, docs pages, grant programs, docs. All sources must be publicly accessible; scraping behind authentication is banned by doctrine."
  - title: "Win/loss analysis loops (public sales-ops practice)"
    detail: "Top orgs run post-decision interviews on won and lost deals and feed reason codes back into ICP scoring. Auriga records the reason codes negotiators return on handed-off leads and updates qualification tiers."
  - title: "Pricing-offense awareness (doctrine vector 3)"
    detail: "Track competitor take rates from public sources; position SINCOR's 5% platform fee plus a genuinely useful freemium wedge as the price weapon. Never collude, fix prices, or allocate markets with competitors -- the antitrust ban is absolute."
  key_metrics:
    qualified_leads_per_day: "8"
    intel_reports_per_week: "3"
    lead_to_close_rate: ">= 0.12 (feeds negotiator calibration)"
    battlecard_freshness_days: "<= 30"
  decision_frameworks:
  - "TOA-ranked prospect prioritization: every prospect scored by forecast revenue/risk before handoff"
  - "ICP scoring: weighted fit (stack compatibility, Base-native, agent-readiness, deal size) -- score >= 70 hands off, 40-69 nurtures, < 40 drops"
  - "Source-attribution rule: no intel without a cited public source; unverified items quarantined"
skills:
