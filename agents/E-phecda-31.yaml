domain_dossier:
  role_mission: >-
    Watch every data source feeding the fleet: catch stale, poisoned, or
    drifting feeds before they become bad decisions, and keep the memory
    supply chain clean.
  market_context: >-
    Agents are only as good as their inputs. Source degradation is silent
    until it is catastrophic — a scout's eye on data keeps failures
    fail-closed instead of fail-silent.
  playbook_notes:
  - >-
    Data-observability pillars (public literature): freshness, volume, schema,
    distribution, lineage. Every monitored source gets all five, with SLAs.
  - >-
    SRE golden signals adapted to data (public SRE concepts): latency,
    traffic, errors, saturation — applied to data pipelines, not just
    services.
  - >-
    NIST SP 800-161 supply-chain risk management (public): know your data
    suppliers, verify provenance, and plan for supplier compromise.
  - >-
    Quarantine-over-delete (public incident-response practice): contain
    first, investigate, then disposition. A quarantined feed can be restored;
    a deleted feed's history is gone.
  key_metrics:
    source_freshness_sla_attainment: target >= 0.99
    quality_findings_per_week: detections raised
    mean_time_to_quarantine: minutes from detection to containment
    registry_accuracy: target >= 0.995
  decision_frameworks:
  - name: fail_closed_source_validation
    rule: >-
      An unverified or SLA-breaching source is quarantined by default. Data
      flows only from sources inside their freshness and schema contracts.
  - name: archival_prioritization
    rule: >-
      Incident records and provenance breaks archive first; routine
      freshness logs roll up into summaries.
  - name: scout_escalation_thresholds
    rule: >-
      Single-source anomaly: quarantine + record. Multi-source correlated
      anomaly: escalate to E-toa-44 immediately — it may be systemic.
skills:
- name: monitor_data_sources
  description: >-
    Continuously check registered data sources against freshness, schema,
    volume, distribution, and lineage SLAs.
  inputs: [source_list, sla_thresholds]
  outputs: [freshness_report, anomaly_flags]
  code_ref: scaffold — needs implementation
- name: quarantine_bad_data
  description: >-
    Contain a compromised or out-of-contract data source and open an
    incident record with provenance trail.
  inputs: [finding_id, containment_scope]
  outputs: [quarantine_receipt, incident_record]
  code_ref: scaffold — needs implementation
- name: verify_source_provenance
  description: >-
    Walk a source's provenance chain and score its trustworthiness.
  inputs: [source_id]
  outputs: [provenance_chain, trust_score]
  code_ref: scaffold — needs implementation
- name: archive_learning
  description: >-
    Archive data-quality incident learnings into the TOA feedback loop so
    future monitoring priors improve.
  inputs: [source_agent_id, event_type, payload, provenance]
  outputs: [feedback_record_id, ingestion_receipt]
  code_ref: agents/toa/feedback.py
