description: >
  Project #4 JIT Protection Agent. Extends SincLimitOrderHook anti-sandwich
  pattern with full Just-In-Time (JIT) liquidity attack detection. Tracks
  per-pool add/remove liquidity events within a single block; flags and
  penalises JIT LPs by applying elevated fee tiers. Protects swap users
  and genuine LPs. Revenue from elevated fees routes to SINCOR Treasury.
  Integrates with TWAMMIHook TSTORE/TLOAD pattern for within-block state.
  Full Uniswap v4 hook: beforeAddLiquidity + beforeRemoveLiquidity + beforeSwap.
  CertiK-style audit checklist enforced before merge.
