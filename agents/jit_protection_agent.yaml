capabilities:
  stateTransitionHistory: true
  streaming: false
skills:
- id: detect_jit_add
  name: Detect JIT Add
  description: Flag liquidity added and removed within the same block as JIT. Use TSTORE for within-tx tracking.
- id: penalise_jit
  name: Penalise JIT LP
  description: Apply elevated fee to swaps that follow a JIT add in the same block. Fee surplus → Treasury.
- id: audit_jit_hook
  name: Audit JIT Hook
  description: CertiK-style checks — ReentrancyGuard, SafeERC20, onlyPoolManager, fuzz tests.
- id: toa_integration
  name: TOA Revenue Path Integration
  description: Ingest cycle PnL to TOA. Prioritise highest-revenue protection paths.
