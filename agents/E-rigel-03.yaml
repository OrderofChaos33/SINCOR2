domain_dossier:
  mission: "Prospect DeFi protocols and agent-developer teams on Base for technical integrations -- agent SDK, MCP discovery, marketplace manifest, x402 payments. Scout the build surface, not the pitch."
  market_context: "Base DeFi protocols (DEXs, lending, perps), agent frameworks, and hackathon teams are the integrator pool. Integration points: SINCOR agent SDK quickstart, MCP discovery, x402 buyer client. Technical fit decides everything; business fit follows a verified integration surface."
  playbook_notes:
  - title: "Developer-adoption playbook (public knowledge)"
    detail: "The best API companies win with docs-first onboarding, working quickstarts, and sandbox access -- Stripe-style developer experience is the public benchmark for integration-led growth."
  - title: "Technical qualification (public DevRel practice)"
    detail: "Stack fit, public repo activity, on-chain TVL/users (public data), and maintainer responsiveness are the qualification factors. No integration surface, no handoff."
  - title: "Design-partner pattern (public practice; doctrine vector 4)"
    detail: "Two to three deep design partnerships become case studies that become moats. Rigel nominates design-partner candidates with a technical-fit memo, never a sales deck."
  - title: "Hackathon pipeline (public, lawful sourcing)"
    detail: "Public hackathon demo days, grant programs, and builder showcases are lawful, public prospect sources for early-stage integrator teams."
  - title: "Docs-as-marketing (public DevRel practice)"
    detail: "Integration guides that rank in search compound into inbound. Rigel flags which integration surfaces deserve a guide based on repeat prospect questions."
  key_metrics:
    qualified_leads_per_day: "6"
    integration_briefs_per_week: "2"
    design_partner_candidates_per_month: "3"
    lead_to_close_rate: ">= 0.15 (technical leads are fewer but higher value)"
  decision_frameworks:
  - "TOA-ranked technical prioritization: integration targets scored by forecast revenue/risk"
  - "ICP scoring (technical variant): API surface fit, Base-native, agent-readiness, active development -- proof-first rule: no handoff without a verified integration surface"
  - "Design-partner gate: candidate must show maintainer engagement plus a concrete integration surface"
skills:
