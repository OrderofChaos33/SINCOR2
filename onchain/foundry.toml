[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
gas_reports = ["SincBondingCurve", "SincLimitOrderHook", "SincGenesisNFT"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# Foundry 1.8 solar preprocessor (dynamic test linking) emits virtual
# foundry-pp/* sources that crytic-compile 0.4.2 / Slither 0.11.6 cannot parse.
dynamic_test_linking = false

[fuzz]
runs = 1000

[invariant]
runs = 100
depth = 50
fail_on_revert = true

[rpc_endpoints]
base = "${BASE_RPC_URL}"
sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
