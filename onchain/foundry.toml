# Root Foundry profile for root contracts/ + test/ (session validator, escrow, v4 hooks).
# Submodules or specific stacks (e.g., v4 hooks) can still extend or run via onchain/foundry.toml.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Compiler & EVM Configuration
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Global Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Bytecode & Verification
cbor_metadata = true
bytecode_hash = "ipfs"

# Isolated, offline profile for the P24 local-simulation safety regression.
# Use: FOUNDRY_PROFILE=p24 forge test --offline --match-path test/p24/P24Deploy.t.sol
[profile.p24]
src = "src/p24"
test = "test/p24"
out = "out-p24"
cache_path = "cache-p24"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

# File System Security Permissions
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./out" }
]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 15

# Network RPC Aliases
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

# Etherscan / BaseScan Verification Configuration
[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
