# Shadow safety CI: fail-closed runtime-isolation gate + supply-chain pin gate.
#
# Read-only by design: permissions are read-all, no secrets are referenced,
# and there are NO deployment, wallet, contract-broadcast, or live-provider
# steps anywhere in this workflow. A passing shadow gate never implies
# permission to deploy or execute a transaction.
#
# Required branch-protection checks (exact names after first run):
#   Shadow safety gates / Shadow safety gate
#   Shadow safety gates / Supply-chain gate
name: Shadow safety gates

on:
  push:
  pull_request:
    branches: [main]
  merge_group:

# Read-only: explicitly NO secrets, NO deployments.
permissions: read-all

jobs:
  # ------------------------------------------------------------------
  # Job 1 (exact name): Shadow safety gate
  # ------------------------------------------------------------------
  shadow-safety-gate:
    name: Shadow safety gate
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      # Pinned to full commit SHA (actions/checkout v4.2.2). Tags are
      # mutable; SHAs are the only immutable reference.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pinned to full commit SHA (actions/setup-python v5.6.0).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # FAIL-CLOSED: the runtime-isolation suite is the enforcement point.
      # If it is missing, the gate fails before any test runs.
      - name: Fail-closed check for runtime-isolation suite
        run: |
          test -f tests/pytest/test_shadow_runtime_isolation.py \
            || (echo "FAIL-CLOSED: tests/pytest/test_shadow_runtime_isolation.py is missing" && exit 1)

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # The shadow_monitor + governance packages are stdlib-only, so the
          # isolation suite needs nothing beyond pytest itself.
          pip install pytest

      - name: Run shadow safety tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest \
            tests/pytest/test_shadow_boundary.py \
            tests/pytest/test_shadow_events.py \
            tests/pytest/test_shadow_anomaly.py \
            tests/pytest/test_shadow_dashboard.py \
            tests/pytest/test_shadow_runtime_isolation.py \
            -v

  # ------------------------------------------------------------------
  # Job 2 (exact name): Supply-chain gate
  # ------------------------------------------------------------------
  supply-chain-gate:
    name: Supply-chain gate
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      # Pinned to full commit SHA (actions/checkout v4.2.2).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # No external action: implemented inline so the gate has no new
      # supply-chain dependency of its own. Every third-party `uses:` ref in
      # .github/workflows/*.yml must be a full 40-char commit SHA; tags
      # (@v4), branches, or short SHAs fail the gate. Local actions
      # (./.github/...) and docker:// refs are exempt.
      - name: Verify all third-party actions are SHA-pinned
        shell: python
        run: |
          import pathlib, re, sys

          workflows = sorted(pathlib.Path(".github/workflows").glob("*.yml"))
          uses_re = re.compile(r"^\s*-\s*uses:\s*(\S+)\s*(?:#.*)?$", re.M)
          sha_re = re.compile(r"^[0-9a-f]{40}$")
          violations = []

          for wf in workflows:
              for match in uses_re.finditer(wf.read_text()):
                  ref = match.group(1).strip().strip("'\"")
                  if ref.startswith("./") or ref.startswith("docker://"):
                      continue  # local / container refs are not third-party actions
                  if "@" not in ref:
                      violations.append(f"{wf.name}: {ref} (no version ref at all)")
                      continue
                  _action, pin = ref.rsplit("@", 1)
                  if not sha_re.fullmatch(pin):
                      violations.append(f"{wf.name}: {ref} (not a 40-char SHA)")

          if violations:
              print("FAIL: unpinned third-party action references found:")
              for v in violations:
                  print(f"  - {v}")
              print("Pin every third-party action to a full 40-char commit SHA.")
              sys.exit(1)
          print(f"OK: all third-party actions pinned ({len(workflows)} workflow files scanned).")
