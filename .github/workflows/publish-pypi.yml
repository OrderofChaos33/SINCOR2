name: Publish sincor-x402 to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for PyPI OIDC Trusted Publishing

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sincor-x402
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        working-directory: packages/sincor-x402  # Adjust if builder placed sincor-x402 at a different path in SINCOR2
        run: |
          python -m build
          twine check --strict dist/*

      - name: Publish package distributions to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sincor-x402/dist/
