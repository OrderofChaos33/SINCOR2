name: CI

# Paused: GitHub Actions billing is locked, so every push failed in ~1s
# and spammed "Run failed" notifications. Manual only until billing is fixed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: |
          ruff check src/sincor2/app.py src/sincor2/mvp_app.py src/sincor2/settings.py src/sincor2/startup.py src/sincor2/error_handling.py src/sincor2/blueprints tests/pytest

      - name: Test
        env:
          PYTHONPATH: .:src:src/sincor2
        run: pytest tests/pytest/test_toa.py tests/pytest/test_settings.py tests/pytest/test_ct01_p24_deploy_no_live.py tests/pytest/test_fee_conversion_executor.py tests/pytest/test_treasury_policy_failclosed.py --cov=src/sincor2 --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage

  p24-simulation-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned forge-std
        working-directory: onchain
        run: forge install foundry-rs/forge-std@v1.9.7 --no-git
      - name: P24 local simulation safety regression
        working-directory: onchain
        run: FOUNDRY_PROFILE=p24 forge test --offline --match-path test/p24/P24Deploy.t.sol -vv
