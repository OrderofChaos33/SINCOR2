# Root Foundry profile for contracts/ + test/ (session validator, escrow, v4 hooks).
# The existing Uniswap v4 stack still lives under onchain/foundry.toml.
#
# Dependencies are VENDORED under lib/ and committed (see lib/VENDORED.md
# for exact pins and sources; .gitignore carries explicit negations for the
# vendored dirs so they survive the Python `lib/` rule). Re-vendor with:
#   git clone --branch v1.9.7 --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
#   git clone --branch v5.5.0 --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
#   git clone --branch v4.9.6 --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts-v4
#   git clone https://github.com/Uniswap/v4-core lib/v4-core && git -C lib/v4-core checkout d153b048868a60c2403a3ef5b2301bb247884d46
#   git clone https://github.com/Uniswap/v4-periphery lib/v4-periphery && git -C lib/v4-periphery checkout 7ebd04b161745b75ed0c24ba2df3bc7c25f65606
#   git clone https://github.com/Uniswap/permit2 lib/permit2 && git -C lib/permit2 checkout cc56ad0f3439c502c246fc5cfcc3db92bb8b7219
#   git clone https://github.com/OpenZeppelin/uniswap-hooks lib/uniswap-hooks && git -C lib/uniswap-hooks checkout 26dc8e53f812a1ca390d470342adb6cd8c3286ad
#   git clone https://github.com/transmissions11/solmate lib/solmate && git -C lib/solmate checkout 4b47a19038b798b4a33d9749d25e570443520647
#   (strip each clone's .git/ before committing; forge build should then pass)
#
# The OZ v4 copy exists ONLY for the legacy security/ReentrancyGuard.sol
# import path used by contracts/hooks/IntentHook.sol and IntentHookV2.sol
# (file-level remapping below; the contracts themselves are untouched).
# The three hooks already import the file-level SwapParams type from
# v4-core's types/PoolOperation.sol (the IPoolManager.SwapParams API was
# removed from v4-core in Apr 2025).

[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
# Sandbox hooks excluded from compilation (same --skip set the module
# READMEs have always documented, moved into config so plain
# `forge build` / `forge test` are green in CI):
# contracts/hooks/IntentHook.sol and IntentHookV2.sol have NEVER compiled
# against any published v4-core / uniswap-hooks release — they contain
# logic-level errors that predate vendoring (try abi.decode(...) x4,
# FullMath.mulDivUp which does not exist in v4-core's FullMath,
# IntentHook implements only 2 of IHooks' callbacks, IntentHookV2
# overrides BaseHook's non-virtual external callbacks instead of the
# internal _beforeSwap/_afterSwap pattern). Fixing them is contract
# surgery, out of scope for vendoring; the files are kept byte-identical
# in place. Remove these entries when the hooks are properly repaired.
skip = ["IntentHook.sol", "IntentHookV2.sol"]
remappings = [
    # File-level remap MUST come first: solc applies the first matching
    # prefix, and @openzeppelin/contracts/ below would otherwise shadow it.
    # IntentHook.sol / IntentHookV2.sol import the OZ v4 path
    # @openzeppelin/contracts/security/ReentrancyGuard.sol, which does not
    # exist in OZ v5. Contracts themselves are untouched.
    "@openzeppelin/contracts/security/ReentrancyGuard.sol=lib/openzeppelin-contracts-v4/contracts/security/ReentrancyGuard.sol",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/src/",
    "forge-std/=lib/forge-std/src/",
    "permit2/=lib/permit2/",
    "solmate/=lib/solmate/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
]

[fuzz]
runs = 256

# Deep campaign profile (pre-deploy / audit runs):
#   FOUNDRY_PROFILE=ci-deep forge test
# Inherits src/test/libs/solc from [profile.default]; only the campaign
# knobs below are overridden.
[profile.ci-deep]
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true

[profile.ci-deep.fuzz]
runs = 10000

[profile.ci-deep.invariant]
runs = 256
depth = 250
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
