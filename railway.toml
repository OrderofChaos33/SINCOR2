# Railway config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "python -m gunicorn sincor2.mvp_app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class sync --timeout 180 --access-logfile - --error-logfile - --log-level info"
