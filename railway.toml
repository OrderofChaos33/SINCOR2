# Railway config-as-code. This file OVERRIDES Dockerfile CMD.
# Previous startCommand: gunicorn sincor2.mvp_app:app
# That import runs BEFORE the listen socket exists. If it raises or
# blocks, healthchecks fail with "service unavailable" for the full window.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m gunicorn railway_start:app --config gunicorn.conf.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
