# Railway config-as-code. This file OVERRIDES Dockerfile CMD.
# startCommand must stay railway_start:app so PORT is bound before mvp_app
# imports. Do not point this back at sincor2.mvp_app:app — that import runs
# before the listen socket exists and Railway bills crash-loop replicas.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m gunicorn railway_start:app --config gunicorn.conf.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
