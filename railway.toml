# Railway config-as-code
# CRITICAL: In the Railway dashboard service Variables, set:
#   NO_CACHE=1
# Then Deploy. Remove NO_CACHE after one successful healthy deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[build.args]
CACHEBUST = "20260727v5"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "rm -rf /home/appuser/.local/lib/python3.11/site-packages/weasyprint* 2>/dev/null; cat /app/.railway-build-stamp 2>/dev/null; gunicorn sincor2.mvp_app:app --bind 0.0.0.0:${PORT:-8080} --workers 1 --worker-class sync --timeout 180 --access-logfile - --error-logfile - --log-level info"
