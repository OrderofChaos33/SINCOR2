<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay with USDC on Base — SINCOR</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0b0e14; color: #e8ecf1; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 0 auto; background: #121722; border: 1px solid #232b3d;
          border-radius: 12px; padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: #9aa4b8; font-size: 14px; margin-bottom: 20px; }
  .amount { font-size: 34px; font-weight: 700; margin: 8px 0; }
  .meta { font-size: 13px; color: #9aa4b8; word-break: break-all; margin-bottom: 6px; }
  .meta b { color: #cfd6e4; font-weight: 600; }
  button { display: block; width: 100%; margin-top: 12px; padding: 13px;
           font-size: 15px; font-weight: 600; border: 0; border-radius: 8px;
           background: #2f6df6; color: #fff; cursor: pointer; }
  button.secondary { background: #1d2433; color: #cfd6e4; border: 1px solid #2c364c; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: 14px; min-height: 20px; white-space: pre-wrap;
         word-break: break-word; }
  #msg.err { color: #ff9d9d; }
  #msg.ok { color: #8fe3a8; }
  .step { margin-top: 18px; padding-top: 16px; border-top: 1px solid #1e2637; }
  .step h2 { font-size: 14px; margin: 0 0 8px; color: #9aa4b8;
             text-transform: uppercase; letter-spacing: .06em; }
  .done { color: #8fe3a8; }
  #tokenBox { margin-top: 10px; }
  #tokenBox input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 12px;
                    background: #0b0e14; color: #cfd6e4; border: 1px solid #2c364c;
                    border-radius: 8px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #2c364c;
             border-top-color: #2f6df6; border-radius: 50%; animation: spin 1s linear infinite;
             vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1>Pay with USDC on Base</h1>
  <div class="sub">x402 micropayment &mdash; real onchain transfer to the SINCOR treasury.</div>

  <div id="checkoutArea">
    <div class="spinner" aria-hidden="true"></div> Loading payment details&hellip;
  </div>

  <div id="payArea" hidden>
    <div class="amount" id="amountLine"></div>
    <div class="meta">Merchant <b id="merchantLine"></b></div>
    <div class="meta">Network <b id="networkLine"></b></div>
    <div class="meta" id="expiryLine"></div>

    <div class="step">
      <h2>1 &middot; Connect wallet</h2>
      <button id="btnConnect" type="button">Connect wallet</button>
      <div class="meta" id="walletLine"></div>
    </div>

    <div class="step" id="bindStep" hidden>
      <h2>2 &middot; Prove wallet ownership</h2>
      <div class="sub">Sign a free message so the payment can be matched to your wallet.</div>
      <button id="btnBind" type="button" disabled>Sign ownership message</button>
    </div>

    <div class="step">
      <h2><span id="payStepNum">2</span> &middot; Pay</h2>
      <button id="btnPay" type="button" disabled>Pay with USDC</button>
      <button id="btnOnramp" type="button" class="secondary" hidden>Don&rsquo;t have USDC? Buy with card</button>
    </div>

    <div id="tokenBox" hidden>
      <h2>Access token</h2>
      <input id="tokenField" readonly aria-label="access token">
    </div>
  </div>

  <div id="msg" role="status"></div>
</div>

<script type="application/json" id="rail-bootstrap">{{ bootstrap|tojson }}</script>
<script>
(function () {
  "use strict";
  var boot = JSON.parse(document.getElementById("rail-bootstrap").textContent);
  var resourceId = boot.resource_id;
  var onrampConfigured = !!boot.onramp_configured;

  var BASE_CHAIN_ID = 8453;
  var BASE_CHAIN_HEX = "0x2105"; // Base mainnet
  var ERC20_TRANSFER_SELECTOR = "a9059cbb";

  var $ = function (id) { return document.getElementById(id); };
  var msg = $("msg"), checkoutArea = $("checkoutArea"), payArea = $("payArea");

  var challenge = null;      // full /rail/checkout response
  var payment = null;        // challenge.payment
  var wallet = null;         // connected address
  var bound = false;         // ownership signature accepted
  var busy = false;

  function setMsg(text, cls) {
    msg.textContent = text || "";
    msg.className = cls || "";
  }
  function trunc(addr) {
    return addr && addr.length > 12 ? addr.slice(0, 6) + "\u2026" + addr.slice(-4) : addr;
  }

  async function postJSON(url, body) {
    var r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    var data = null;
    try { data = await r.json(); } catch (e) { /* non-JSON: fall through */ }
    if (!r.ok) {
      var err = (data && data.error) ? String(data.error) : ("HTTP " + r.status);
      throw new Error(err);
    }
    return data;
  }

  function provider() { return window.ethereum || null; }

  async function ensureBase() {
    var eth = provider();
    var current = await eth.request({ method: "eth_chainId" });
    if (parseInt(current, 16) === BASE_CHAIN_ID) return;
    try {
      await eth.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: BASE_CHAIN_HEX }]
      });
    } catch (e) {
      if (e && e.code === 4902) {
        await eth.request({
          method: "wallet_addEthereumChain",
          params: [{
            chainId: BASE_CHAIN_HEX,
            chainName: "Base",
            nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
            rpcUrls: ["https://mainnet.base.org"],
            blockExplorerUrls: ["https://basescan.org"]
          }]
        });
      } else {
        throw e;
      }
    }
  }

  function erc20TransferData(to, amountAtomic) {
    var toHex = to.toLowerCase().replace(/^0x/, "").padStart(64, "0");
    var amtHex = BigInt(amountAtomic).toString(16).padStart(64, "0");
    return "0x" + ERC20_TRANSFER_SELECTOR + toHex + amtHex;
  }

  async function waitForReceipt(eth, txHash) {
    for (var i = 0; i < 120; i++) {
      var receipt = await eth.request({
        method: "eth_getTransactionReceipt", params: [txHash]
      });
      if (receipt && receipt.blockNumber) return receipt;
      await new Promise(function (res) { setTimeout(res, 2000); });
    }
    throw new Error("timed out waiting for the transaction receipt; " +
      "check Basescan for " + txHash + " before retrying");
  }

  // ---- step 0: fetch the challenge ---------------------------------------
  async function loadCheckout() {
    setMsg("");
    try {
      challenge = await postJSON("/rail/checkout", { pack_sku: resourceId });
    } catch (e) {
      checkoutArea.innerHTML = "";
      setMsg("Could not start the payment: " + e.message, "err");
      return;
    }
    if (!challenge || !challenge.payment || !challenge.challenge_id) {
      checkoutArea.innerHTML = "";
      setMsg("Could not start the payment: malformed checkout response", "err");
      return;
    }
    payment = challenge.payment;
    var extra = payment.extra || {};
    $("amountLine").textContent =
      (extra.amount_display != null ? extra.amount_display : "?") + " " +
      (extra.token || "USDC");
    $("merchantLine").textContent = trunc(payment.payTo);
    var netName = payment.chainId === BASE_CHAIN_ID
      ? "Base (chain " + payment.chainId + ")"
      : "chain " + payment.chainId;
    $("networkLine").textContent = netName;
    if (challenge.expires_at) {
      $("expiryLine").innerHTML = "";
      $("expiryLine").appendChild(document.createTextNode("Challenge expires "));
      var b = document.createElement("b");
      b.textContent = new Date(challenge.expires_at).toUTCString();
      $("expiryLine").appendChild(b);
    }
    // Bind step only when the server says ownership proof is required.
    if (challenge.bind && challenge.bind.bind_url) {
      $("bindStep").hidden = false;
      $("payStepNum").textContent = "3";
    }
    if (onrampConfigured) $("btnOnramp").hidden = false;
    checkoutArea.innerHTML = "";
    payArea.hidden = false;
  }

  // ---- step 1: connect ----------------------------------------------------
  $("btnConnect").addEventListener("click", async function () {
    var eth = provider();
    if (!eth) {
      setMsg("No Ethereum wallet found. Install MetaMask or Coinbase Wallet, " +
        "then reload this page.", "err");
      return;
    }
    setMsg("");
    try {
      var accounts = await eth.request({ method: "eth_requestAccounts" });
      if (!accounts || !accounts.length) throw new Error("no accounts returned");
      wallet = accounts[0];
      $("walletLine").textContent = "Connected: " + trunc(wallet);
      setMsg("Wallet connected.", "ok");
      refreshButtons();
    } catch (e) {
      if (e && e.code === 4001) setMsg("Connection rejected in wallet.", "err");
      else setMsg("Could not connect wallet: " + (e && e.message || e), "err");
    }
  });

  // ---- step 2: ownership bind (only when the challenge requires it) -------
  $("btnBind").addEventListener("click", async function () {
    if (!challenge.bind || !challenge.bind.bind_url || !wallet) return;
    var eth = provider();
    setMsg("");
    try {
      // Canonical bind message (server rebuilds it byte-identically from its
      // own stored challenge_id / resource_id / wallet).
      var message = ["SINCOR-X402-CHALLENGE-BIND",
        challenge.challenge_id,
        challenge.resource_id || resourceId,
        wallet.toLowerCase()].join("|");
      var signature = await eth.request({
        method: "personal_sign",
        params: [message, wallet]
      });
      var res = await postJSON(challenge.bind.bind_url, {
        challenge_id: challenge.challenge_id,
        payer_wallet: wallet,
        signature: signature
      });
      if (res && res.ok === false) throw new Error(res.error || "bind rejected");
      bound = true;
      $("btnBind").disabled = true;
      $("btnBind").textContent = "\u2713 Wallet verified";
      setMsg("Wallet ownership verified.", "ok");
    } catch (e) {
      if (e && e.code === 4001) setMsg("Signature rejected in wallet.", "err");
      else setMsg("Wallet verification failed: " + (e && e.message || e), "err");
    }
    refreshButtons();
  });

  function needsBind() {
    return !!(challenge && challenge.bind && challenge.bind.bind_url) && !bound;
  }
  function refreshButtons() {
    var canPay = !!wallet && !needsBind() && !busy;
    $("btnPay").disabled = !canPay;
    $("btnBind").disabled = !(wallet && needsBind() && !busy);
  }

  // ---- step 3: pay --------------------------------------------------------
  $("btnPay").addEventListener("click", async function () {
    if (busy || !wallet || !payment) return;
    var eth = provider();
    if (!eth) { setMsg("No Ethereum wallet found.", "err"); return; }
    busy = true;
    refreshButtons();
    setMsg("");
    try {
      await ensureBase();
      var data = erc20TransferData(payment.asset, payment.maxAmountRequired);
      setMsg("Confirm the USDC transfer in your wallet\u2026");
      var txHash = await eth.request({
        method: "eth_sendTransaction",
        params: [{
          from: wallet,
          to: payment.asset,
          data: data,
          chainId: BASE_CHAIN_HEX
        }]
      });
      setMsg("Transaction sent (" + trunc(txHash) + "). Waiting for confirmation\u2026");
      await waitForReceipt(eth, txHash);
      setMsg("Payment confirmed onchain. Finalizing with SINCOR\u2026");
      var settle = await postJSON("/rail/settle", {
        challenge_id: challenge.challenge_id,
        tx_hash: txHash,
        payer_wallet: wallet
      });
      if (settle && settle.ok) {
        setMsg("Payment complete.", "ok");
        $("btnPay").disabled = true;
        $("btnPay").textContent = "\u2713 Paid";
        if (settle.access_token) {
          $("tokenBox").hidden = false;
          $("tokenField").value = settle.access_token;
        }
      } else {
        throw new Error((settle && settle.error) || "settle rejected the payment");
      }
    } catch (e) {
      // User rejection: surface once, never retry-spam.
      if (e && e.code === 4001) setMsg("Transaction rejected in wallet.", "err");
      else setMsg("Payment failed: " + (e && e.message || e), "err");
    }
    busy = false;
    refreshButtons();
  });

  // ---- onramp --------------------------------------------------------------
  $("btnOnramp").addEventListener("click", async function () {
    setMsg("");
    try {
      var params = new URLSearchParams();
      var extra = (payment && payment.extra) || {};
      if (extra.amount_display != null) params.set("amount_usd", extra.amount_display);
      if (wallet) params.set("destination_address", wallet);
      var r = await fetch("/rail/onramp?" + params.toString());
      var data = await r.json();
      if (!r.ok || !data.ok) {
        throw new Error((data && data.error) || ("HTTP " + r.status));
      }
      window.location.href = data.url;
    } catch (e) {
      setMsg("Card purchase unavailable: " + (e && e.message || e), "err");
    }
  });

  loadCheckout();
})();
</script>
</body>
</html>
