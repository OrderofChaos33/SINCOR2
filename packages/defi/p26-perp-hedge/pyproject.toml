[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sincor-perp-hedge-swarm"
version = "0.1.0"
description = "P26 - Perp DEX Hedging Swarm (suite name P06): standalone reference package extracted from the SINCOR2 platform tree. EXTERNAL state; no hedging service is running for outside accounts."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies: none. The extracted module uses only the
# Python standard library (see PACKAGING.md dependency inventory).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
